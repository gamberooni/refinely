[project]
name = "refinely"
description = "Minimal AI application evaluation & optimization prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
    { name = "gamberooni", email = "zhaoyoong@gmail.com" }
]
keywords = ["llm", "evaluation", "optimization", "optuna", "rag", "qa", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai",
    "pydantic>=2",
    "pydantic-settings",
    "tenacity",
    "optuna",
    "click",
    "sqlalchemy>=2.0",
    "rich",
]

[project.urls]
Homepage = "https://github.com/gamberooni/refinely"
Repository = "https://github.com/gamberooni/refinely"
Issues = "https://github.com/gamberooni/refinely/issues"

[project.optional-dependencies]
dspy = [
    "dspy>=3.1",
    "litellm<1.92",
]

[project.scripts]
refinely = "refinely.cli:main"

[project.entry-points."refinely.apps"]
extraction = "apps.extraction"
qa = "apps.qa"
rag = "apps.rag"

[dependency-groups]
dev = [
    "pytest",
]
dspy = [
    "dspy>=3.1",
    "litellm<1.92",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refinely", "apps"]

[tool.hatch.build.targets.wheel.force-include]
"datasets" = "refinely/datasets"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
